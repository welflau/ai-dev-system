[pytest]
# backend/ 下此前没有 pytest 配置，compose_sop 这类纯函数模块无法直接被 import。
# pythonpath = . 让 `from sop.loader import ...` 在仓库根或 backend/ 下跑都成立。
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认静音 loader 的 warning（失锚 fragment 会刷屏）；需要看日志时 -o log_cli=true
log_cli = false
addopts = -q --strict-markers

# SOP Core —— 所有项目通用的基础阶段（v0.17 trait-first 骨架）
#
# 配合 backend/sop/fragments/*.yaml 做动态组合。
# fragments 按 required_traits / required_ticket_type 过滤后插入到 core 对应位置。
# compose 后的 SOP 等价于 default_sop.yaml 的格式，orchestrator 无感消费。

name: 通用开发流程（trait-first 骨架）
version: "3.0"
description: 架构 → 开发 → 代码审查 → 产品验收 → 部署

global:
  max_retries: 5
  zombie_timeout_seconds: 120

# 基础阶段。fragments 可通过 insert_after / insert_before 插入新阶段在这些之间。
#
# v0.20 裁剪：每个 stage 可声明 required_traits（复用 fragment 的 all_of/any_of/none_of
# 匹配器），不满足则不参与组装。这样内容生成类项目（pipeline:content）不必先跑完
# 架构设计/代码开发/代码审查/部署。
#
# ⚠️ 裁剪的一个硬约束：裁剪后首个阶段的 trigger_on 会被强制改写成 pending
#    （见 _relink_stage_transitions 的 docstring）。所以这里手写 trigger_on: pending
#    已不是「唯一保障」，但保留它让 yaml 自身可读。
#
# ⚠️ 另一个硬约束：7 个 fragment 锚在 development 上（engine_compile / i18n_check /
#    play_test / smoke_test / ue_test_gen，以及 insert_before 的 asset_gen）。它们的
#    required_traits 恰好都是代码/游戏项目，所以 pipeline:content 下不会命中 ——
#    但这是**两套独立 trait 条件碰巧对齐**，不是结构性保证。裁剪导致 fragment 失锚时
#    compose_sop 会打 ERROR + 写 sop_diagnostics，不要靠肉眼看日志。
base_stages:
  - id: planning
    name: 策划设计
    agent: PlannerAgent
    action: write_prd
    trigger_on: pending
    success_status: planning_done
    description: 为工单产出标准化 PRD（用户故事/验收标准/边界条件/资产线索）
    # 所有 pipeline 都需要（内容类项目用它承载需求拆解）

  - id: architecture
    name: 架构设计
    agent: ArchitectAgent
    action: design_architecture
    trigger_on: planning_done
    success_status: architecture_done
    description: 分析需求，设计增量技术架构方案
    required_traits:
      none_of:
        - pipeline:content
    config:
      read_existing_code: true
      max_code_chars: 1500
      max_tokens: 2000
      self_consistency: false
      consistency_n: 3
      consistency_temperature: 0.8

  - id: development
    name: 代码开发
    agent: DevAgent
    action: develop
    trigger_on: architecture_done
    success_status: development_done
    # v0.19.x A 方案：UE 自测 Layer 1 失败 → self_test_failed → reject_goto 回 development
    # sop_to_transition_rules 会自动派生 self_test_failed → DevAgent.fix_issues
    reject_status: self_test_failed
    reject_goto: development
    description: 根据架构设计编写代码，含自测
    required_traits:
      none_of:
        - pipeline:content
    config:
      read_existing_code: true
      max_code_chars: 2000
      max_tokens: 16000
      self_test: true
      verify_disk_files: true
      generate_dev_notes: true
      # v0.19.x A 方案 Layer 2：UBT -SingleFile 预编译（30-90s，可选）
      # 默认关（Layer 1 静态规则已能抓 80% 新手错；开启意味着每次开发多等 1 分钟）
      # UE 项目深度迭代时建议打开，通过 SOP fragment 覆盖即可
      ue_precompile: false
      ue_precompile_timeout: 120

  - id: code_review
    name: 代码审查
    agent: ReviewAgent
    action: code_review
    trigger_on: development_done
    success_status: review_passed
    description: ReviewAgent 读取实际代码做审查
    required_traits:
      none_of:
        - pipeline:content
    config:
      max_code_chars: 12000
      per_file_code_chars: 6000
      pass_score: 7
      block_on_low_score: false

  - id: acceptance
    name: 产品验收
    agent: ProductAgent
    action: acceptance_review
    trigger_on: review_passed
    success_status: acceptance_passed
    reject_status: acceptance_rejected
    reject_goto: rework
    description: 产品经理验收代码是否符合需求
    # 所有 pipeline 都要验收。注意 reject_goto: rework 在 pipeline:content 下会悬空
    # （rework 依赖 development），compose_sop 的 _prune_dangling_reject_gotos 会
    # 剥离这两个字段并写 diagnostic —— 届时验收被拒 = 停在原地等人工，不会死锁。
    config:
      max_rework_count: 5
      force_pass_after_max_rework: true

  - id: deploy
    name: 部署
    agent: DeployAgent
    action: deploy
    trigger_on: acceptance_passed
    success_status: deployed
    description: 部署到测试环境
    # 内容类项目没有「部署」语义，但 deployed 是 _HARD_TERMINAL 里的流程终点，
    # 也是 _check_requirement_completion 的 DONE_STATUSES 之一。裁掉它会让工单
    # 停在 acceptance_passed —— 既不是终态、也没有后续规则，需求永远不会标完成。
    # 所以保留，由 DeployAgent 对内容项目走空实现（后续 skill 链接入时再细化）。
    config:
      target_env: test

  # 返工阶段：acceptance_rejected 或 testing_failed 时回到 DevAgent 修复
  # orchestrator 通过 reject_goto 查找此 stage，需要它存在
  #
  # branch_only: true —— 这是分支目标（只通过 reject_goto 进入），不在线性 pipeline 里。
  # compose_sop 的 _relink_stage_transitions 必须跳过此 stage，否则 rework 的 trigger_on
  # 会被前一个 stage 的 success_status 覆盖，导致死循环（例：deploy.success=deployed 覆盖
  # rework.trigger=acceptance_rejected 后，rework 被 deployed 触发 → 产出 development_done
  # → 重新触发 engine_compile / code_review → 又走到 deploy → 又触发 rework → ...）
  - id: rework
    name: 返工修复
    agent: DevAgent
    action: fix_issues
    trigger_on: acceptance_rejected
    success_status: development_done
    branch_only: true
    description: 验收/测试未通过，根据反馈修复问题后重新进入 code_review
    # 依赖 development（success_status=development_done 由 code_review 消费）。
    # pipeline:content 下 development 被裁 → 本阶段由 _prune_dangling_reject_gotos 移除
    required_traits:
      none_of:
        - pipeline:content
    config:
      read_existing_code: true
      max_tokens: 16000
      enable_reflection: true
      reflection_max_prev: 3

  # 代码生成本身失败（零文件 / 只产出降级模板 / Action 报错）→ development_failed。
  # 不能让它走 orchestrator 的「status=error → blocked」：那是硬终态要人工介入，
  # 而 LLM 一次超时完全值得自动重试。这里和 self_test_failed 同构：
  # 回 DevAgent.fix_issues 带反思重开发，超过全局 MAX_RETRIES=5 次才 blocked 止损。
  # 背景：TK-20260920-ce79a9 —— 降级模板产出 console.log 空壳却一路 deployed。
  - id: development_retry
    name: 开发重试
    agent: DevAgent
    action: fix_issues
    trigger_on: development_failed
    success_status: development_done
    branch_only: true
    description: 代码生成未产出有效代码，反思后重新开发
    # 同 rework：development_failed 由 development 阶段产出，裁掉 development 后不可达
    required_traits:
      none_of:
        - pipeline:content
    config:
      read_existing_code: true
      max_tokens: 16000
      enable_reflection: true
      reflection_max_prev: 3

# Pipeline UI 展示配置（蓝盾风格的 N 阶段视图）。
# compose_sop 会把 fragments 里的 pipeline_view_contrib 合并到这里（Phase C.3）。
# 基础布局：需求分析（合成） → 架构设计 → 开发实现 → 合入Develop（合成）。
# fragments（如 smoke_test / play_test / engine_compile）会动态往"测试验证"组插，
# 没有任何 fragment 时该组不出现，web 项目维持 4 格视图。
pipeline_view:
  stages:
    - key: requirement_analysis
      name: 需求分析
      icon: 📋
      synthetic: requirement_status
      description: 基于需求 status (submitted/analyzing/decomposed) 判定，ProductAgent 拆单
    - key: architecture
      name: 架构设计
      icon: 🏗️
      sop_stages:
        - architecture
      running_statuses:
        - architecture_in_progress
      description: ArchitectAgent 设计增量技术方案
    - key: development
      name: 开发实现
      icon: 💻
      sop_stages:
        - development
        - code_review
        - acceptance
        - rework
      running_statuses:
        - development_in_progress
        - review_in_progress
        - acceptance_rejected
      description: DevAgent 开发 + ReviewAgent 代码审查 + ProductAgent 验收 + 必要时返工
    - key: merge_develop
      name: 合入Develop
      icon: 🔀
      synthetic: merge
      description: 所有工单完成后 Orchestrator 合并 feat 分支到 develop

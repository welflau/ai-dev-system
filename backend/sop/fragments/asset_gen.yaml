# 美术资产生成 —— 游戏项目特有，在 dev 前把 asset_manifest 里的条目落地
#
# 上游 art_design 阶段（ArtAgent）产出"需要哪些资产"的清单，
# 本阶段（ArtistAgent）负责"资产从哪来"：检索资产库命中即用，未命中给占位图。
id: asset_gen
name: 美术资产生成
insert_before: development
priority: 100
description: 游戏项目在正式 dev 前准备所需美术资产（资产库检索 + 占位图兜底）

required_traits:
  all_of:
    - category:game
required_ticket_type:
  any_of:
    - feature    # 只在新功能需要资产时触发

stage:
  agent: ArtistAgent
  action: generate_assets
  trigger_on: asset_gen_pending
  success_status: assets_ready
  config:
    asset_types:
      - sprite
      - tileset
      - ui_element
      - icon
      - illustration
    # 资产库未命中时产出洋红斜纹占位图，保证流水线不断。
    # 关掉则未命中资产标记为 not_found，交人工处理。
    fallback_to_placeholder: true

# 美术资产是 dev 前的准备工作，给独立 UI 组展示（区别于测试组）
pipeline_view_contrib:
  group: asset_preparation
  create_if_missing:
    name: 资产准备
    icon: 🎨
    insert_before: development

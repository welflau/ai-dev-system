# UE 编译验证。只属于本插件；Godot / Unity 各自的编译阶段放各自的 fragments。
id: engine_compile
name: 引擎编译验证
insert_after: development
priority: 95   # 比 code_review 更靠前：编译不过没必要审代码
description: 用 UnrealBuildTool 编译 UE 项目，发现语法级错误

required_traits:
  any_of:
    - engine:ue5
    - engine:ue4

stage:
  agent: DevAgent
  action: run_engine_compile
  trigger_on: engine_compile_pending
  success_status: engine_compile_passed
  reject_status: engine_compile_failed
  reject_goto: development
  # 宿主按这两个状态收尾，不再按 action 名写死。
  # 手写的 trigger_on 会被 loader 重链覆盖，自愈回跳读的是组合后的值。
  closeout: status
  skip_when: noncode_ticket
  on_success: [resolve_compile_bug]
  on_failure: [create_compile_bug]
  config:
    max_retries: 3
    timeout_seconds: 600

# UE 项目启用 Layer 2 UBT -SingleFile 预编译（self_test 内部开关）
# Godot/Unity 不支持该参数，但 self_test.py 只在 UE 分支里读它，无副作用
stage_overrides:
  - id: development
    config:
      ue_precompile: true
      ue_precompile_timeout: 120

# 编译归到"测试验证"组（按 priority=95 跟 smoke_test/play_test 同列表，
# 最终在 SOP 里 engine_compile 会跑在 code_review 前，但 UI 视图不需要这么细）
pipeline_view_contrib:
  group: testing
  create_if_missing:
    name: 测试验证
    icon: 🧪
    insert_after: development

name: 文档 HTML 同步检查
on:
  push:
    branches: [main, develop]
    paths: ['docs/**', 'dev-notes/**', 'scripts/docs-html/**', '.github/workflows/docs-html.yml']
  pull_request:
    branches: [main, develop]
    paths: ['docs/**', 'dev-notes/**', 'scripts/docs-html/**', '.github/workflows/docs-html.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/docs-html
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check

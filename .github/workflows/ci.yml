name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 后端测试
  backend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Verify import
      working-directory: backend
      run: |
        python -c "from models import TicketStatus; print('Import OK')"

    - name: Run tests
      # 全量 pytest（本地约 5 分半）。此前这个 job 只验证一条 import，
      # 路由挂错函数、包内循环导入这类问题都要等到运行时才暴露。
      # 收集范围由 backend/pytest.ini 决定（testpaths = tests）。
      working-directory: backend
      timeout-minutes: 20
      run: |
        python -m pytest

  # 代码质量检查
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: pip install flake8

    - name: Flake8 lint
      working-directory: backend
      run: |
        # 排除第三方 marketplace/packs 脚本（外部代码，不在我们维护范围）
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=skills/marketplace,skills/packs,skills/use_skills
        flake8 . --count --max-complexity=15 --max-line-length=120 --statistics --exit-zero \
          --exclude=skills/marketplace,skills/packs,skills/use_skills

  # 六层严格 DAG 架构门禁（方案 §6.3 / §10）
  layer-dag-guard:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        # 检查器用标准库 tomllib，3.11+ 即可，无需 pip install 任何依赖
        python-version: '3.12'

    - name: Layer DAG guard
      # 相对 P0 基线（backend/layers_baseline.json，已入库）只许减少不许增加。
      # 退出码非 0 = 出现新增违规 / 豁免到期未清零 / 分界律违规 → CI 红。
      # 检查器以 __file__ 定位仓库根，与 cwd 无关；输出在 stdout，
      # ast.parse 对个别历史源码的 SyntaxWarning 走 stderr，不影响判定。
      run: |
        # 先显式断言基线存在：若不慎删除，检查器会当「无基线」静默放行，
        # 「只减不增」的参照就丢了，必须让 CI 立刻红。
        test -f backend/layers_baseline.json || {
          echo "::error::backend/layers_baseline.json 缺失，P0 基线不可丢"; exit 1;
        }
        python scripts/check_layers.py

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202.907 234.87" width="1202.907" height="234.87" style="--bg:#ffffff;--fg:#1d3839;--accent:#12645e;--border:#608781;background:var(--bg)">
<style>

  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="192.359,117.435 240.359,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="C" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="否" points="369.4173333333334,91.62333333333333 515.7030000000001,91.62333333333333 515.7030000000001,84.985 597.2330000000001,84.985" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B" data-to="D" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="是" points="369.4173333333334,143.24666666666667 431.22900000000004,143.24666666666667 431.22900000000004,149.885 512.759,149.885" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="C" data-to="E" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="728.1030000000001,84.985 778.326,84.985" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D" data-to="F" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="732.549,149.885 778.326,149.885" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="E" data-to="G" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="941.8,84.985 964.6885,84.985 964.6885,117.435 987.577,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="F" data-to="G" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="937.354,149.885 964.6885,149.885 964.6885,117.435 987.577,117.435" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="B" data-to="C" data-label="否">
  <rect x="523.7030000000001" y="68.985" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="538.4680000000001" y="84.135" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">否</text>
</g>
<g class="edge-label" data-from="B" data-to="D" data-label="是">
  <rect x="439.22900000000004" y="133.885" width="29.53" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="453.994" y="149.035" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">是</text>
</g>
<g class="node" data-id="A" data-label="按名称读取 Agent" data-shape="rectangle">
  <rect x="40" y="98.985" width="152.359" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="116.1795" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">按名称读取 Agent</text>
</g>
<g class="node" data-id="B" data-label="存在覆盖行？" data-shape="diamond">
  <polygon points="317.794,40 395.229,117.435 317.794,194.87 240.35899999999998,117.435" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="317.794" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">存在覆盖行？</text>
</g>
<g class="node" data-id="C" data-label="取全局客户端" data-shape="rectangle">
  <rect x="597.2330000000001" y="66.535" width="130.87" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="662.6680000000001" y="84.985" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">取全局客户端</text>
</g>
<g class="node" data-id="D" data-label="缺省字段回填后构造客户端" data-shape="rectangle">
  <rect x="512.759" y="131.435" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="622.654" y="149.885" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">缺省字段回填后构造客户端</text>
</g>
<g class="node" data-id="E" data-label="has_override = false" data-shape="rectangle">
  <rect x="778.326" y="66.535" width="163.474" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="860.063" y="84.985" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">has_override = false</text>
</g>
<g class="node" data-id="F" data-label="has_override = true" data-shape="rectangle">
  <rect x="778.326" y="131.435" width="159.02800000000002" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="857.84" y="149.885" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">has_override = true</text>
</g>
<g class="node" data-id="G" data-label="返回允许展示的字段" data-shape="rectangle">
  <rect x="987.577" y="98.985" width="175.32999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1075.242" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">返回允许展示的字段</text>
</g>
</svg>

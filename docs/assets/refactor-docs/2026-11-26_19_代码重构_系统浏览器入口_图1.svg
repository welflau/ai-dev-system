  <text x="168.42" y="632.8" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">400：显示错误，不再打开新窗口</text>
</g>
<g class="node" data-id="E" data-label="在线程池调用系统浏览器" data-shape="rectangle">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 647.7679999999999 470" width="647.7679999999999" height="470" style="--bg:#ffffff;--fg:#1d3839;--accent:#12645e;--border:#608781;background:var(--bg)">
<style>

  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="B" x1="109.58949999999999" y1="70" x2="109.58949999999999" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="R" x1="275.4235" y1="70" x2="275.4235" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="M" x1="415.693" y1="70" x2="415.693" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="P" x1="563.7429999999999" y1="70" x2="563.7429999999999" y2="440" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="B" data-to="R" data-label="GET /api/events/global" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="109.58949999999999" y1="90" x2="275.4235" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="192.5065" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GET /api/events/global</text>
</g>
<g class="message" data-from="R" data-to="M" data-label="开始迭代 global，创建该连接的队列" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="275.4235" y1="130" x2="415.693" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="345.55825" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">开始迭代 global，创建该连接的队列</text>
</g>
<g class="message" data-from="P" data-to="M" data-label="向 global 发布 log_added" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="563.7429999999999" y1="170" x2="415.693" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="489.71799999999996" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">向 global 发布 log_added</text>
</g>
<g class="message" data-from="M" data-to="R" data-label="event 为 log_added，data 为 JSON 字符串" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="415.693" y1="210" x2="275.4235" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="345.55825" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">event 为 log_added，data 为 JSON 字符串</text>
</g>
<g class="message" data-from="R" data-to="B" data-label="推送一个 SSE 帧" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="275.4235" y1="250" x2="109.58949999999999" y2="250" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="192.5065" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">推送一个 SSE 帧</text>
</g>
<g class="message" data-from="B" data-to="B" data-label="命名事件回调解析 JSON" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="109.58949999999999,290 139.5895,290 139.5895,310 109.58949999999999,310" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="147.5895" y="300" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">命名事件回调解析 JSON</text>
</g>
<g class="message" data-from="B" data-to="R" data-label="关闭连接" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="109.58949999999999" y1="360" x2="275.4235" y2="360" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="192.5065" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">关闭连接</text>
</g>
<g class="message" data-from="R" data-to="M" data-label="结束迭代，finally 移除该队列" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="275.4235" y1="400" x2="415.693" y2="400" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="345.55825" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">结束迭代，finally 移除该队列</text>
</g>
<g class="actor" data-id="B" data-label="浏览器 EventSource" data-type="participant">
  <rect x="30" y="30" width="159.17899999999997" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="109.58949999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">浏览器 EventSource</text>
</g>
<g class="actor" data-id="R" data-label="SSE 路由" data-type="participant">
  <rect x="229.179" y="30" width="92.48899999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="275.4235" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">SSE 路由</text>
</g>
<g class="actor" data-id="M" data-label="事件管理器" data-type="participant">
  <rect x="361.668" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="415.693" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">事件管理器</text>
</g>
<g class="actor" data-id="P" data-label="消息发布者" data-type="participant">
  <rect x="509.71799999999996" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="563.7429999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">消息发布者</text>
</g>
</svg>

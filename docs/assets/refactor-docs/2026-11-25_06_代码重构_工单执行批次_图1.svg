<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 605.993 430" width="605.993" height="430" style="--bg:#ffffff;--fg:#1d3839;--accent:#12645e;--border:#608781;background:var(--bg)">
<style>

  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="A" x1="82.1725" y1="70" x2="82.1725" y2="400" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="226.51749999999998" y1="70" x2="226.51749999999998" y2="400" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="372.715" y1="70" x2="372.715" y2="400" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="A" data-to="DB" data-label="派单，写入 building 和批次 A" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="82.1725" y1="90" x2="372.715" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="227.44375" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">派单，写入 building 和批次 A</text>
</g>
<g class="message" data-from="DB" data-to="DB" data-label="人工退回 pending，清除批次 A" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="372.715,130 402.715,130 402.715,150 372.715,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="410.715" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">人工退回 pending，清除批次 A</text>
</g>
<g class="message" data-from="B" data-to="DB" data-label="再派单，写入 building 和批次 B" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="226.51749999999998" y1="200" x2="372.715" y2="200" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="299.61625" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">再派单，写入 building 和批次 B</text>
</g>
<g class="message" data-from="A" data-to="DB" data-label="提交旧结果，要求 building 且批次 A" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="82.1725" y1="240" x2="372.715" y2="240" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="227.44375" y="230" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">提交旧结果，要求 building 且批次 A</text>
</g>
<g class="message" data-from="DB" data-to="A" data-label="不匹配，保留 B，跳过 A 的完成检查点" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="372.715" y1="280" x2="82.1725" y2="280" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="227.44375" y="270" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">不匹配，保留 B，跳过 A 的完成检查点</text>
</g>
<g class="message" data-from="B" data-to="DB" data-label="提交新结果，要求 building 且批次 B" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="226.51749999999998" y1="320" x2="372.715" y2="320" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="299.61625" y="310" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">提交新结果，要求 building 且批次 B</text>
</g>
<g class="message" data-from="DB" data-to="B" data-label="写入结果，同时清除 B 的写入权" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="372.715" y1="360" x2="226.51749999999998" y2="360" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="299.61625" y="350" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">写入结果，同时清除 B 的写入权</text>
</g>
<g class="actor" data-id="A" data-label="开发执行 A" data-type="participant">
  <rect x="30" y="30" width="104.345" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="82.1725" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">开发执行 A</text>
</g>
<g class="actor" data-id="B" data-label="开发执行 B" data-type="participant">
  <rect x="174.34499999999997" y="30" width="104.345" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="226.51749999999998" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">开发执行 B</text>
</g>
<g class="actor" data-id="DB" data-label="工单数据库" data-type="participant">
  <rect x="318.69" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="372.715" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">工单数据库</text>
</g>
</svg>

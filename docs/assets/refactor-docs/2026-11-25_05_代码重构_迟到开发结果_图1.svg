<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484.1499999999999 604" width="484.1499999999999" height="604" style="--bg:#ffffff;--fg:#1d3839;--accent:#12645e;--border:#608781;background:var(--bg)">
<style>

  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="影响 0 行">
  <rect x="30" y="360" width="276.09999999999997" height="194" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="360" width="88.27" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="369" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [影响 0 行]</text>
  <line x1="30" y1="436" x2="306.09999999999997" y2="436" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="450" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[影响 1 行]</text>
</g>
<g class="block" data-type="alt" data-label="已删除、已终态，或原生开发结果的派单状态不符">
  <rect x="30" y="158" width="424.1499999999999" height="396" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="158" width="328.51" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="167" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [已删除、已终态，或原生开发结果的派单状态不符]</text>
  <line x1="30" y1="234" x2="454.1499999999999" y2="234" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="248" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[仍可处理]</text>
</g>
<line class="lifeline" data-actor="P" x1="86.615" y1="70" x2="86.615" y2="574" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="A" x1="234.66499999999996" y1="70" x2="234.66499999999996" y2="574" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="D" x1="390.12499999999994" y1="70" x2="390.12499999999994" y2="574" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="P" data-to="A" data-label="回传结果与本次派单状态" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="86.615" y1="90" x2="234.66499999999996" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="160.64" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">回传结果与本次派单状态</text>
</g>
<g class="message" data-from="A" data-to="D" data-label="查询当前工单" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="234.66499999999996" y1="130" x2="390.12499999999994" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="312.395" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">查询当前工单</text>
</g>
<g class="message" data-from="A" data-to="P" data-label="停止本轮，跳过结果 Git 处理" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="234.66499999999996" y1="198" x2="86.615" y2="198" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="160.64" y="188" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">停止本轮，跳过结果 Git 处理</text>
</g>
<g class="message" data-from="A" data-to="A" data-label="按原流程处理 Git 或准备错误诊断" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="234.66499999999996,262 264.66499999999996,262 264.66499999999996,282 234.66499999999996,282" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="272.66499999999996" y="272" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">按原流程处理 Git 或准备错误诊断</text>
</g>
<g class="message" data-from="A" data-to="D" data-label="UPDATE ... WHERE id = ? AND status = ?" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="234.66499999999996" y1="332" x2="390.12499999999994" y2="332" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="312.395" y="322" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">UPDATE ... WHERE id = ? AND status = ?</text>
</g>
<g class="message" data-from="A" data-to="P" data-label="已过期，跳过完成检查点及后续派单" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="234.66499999999996" y1="400" x2="86.615" y2="400" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="160.64" y="390" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">已过期，跳过完成检查点及后续派单</text>
</g>
<g class="message" data-from="A" data-to="A" data-label="按分支记录日志、评论或产物" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="234.66499999999996,464 264.66499999999996,464 264.66499999999996,484 234.66499999999996,484" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="272.66499999999996" y="474" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">按分支记录日志、评论或产物</text>
</g>
<g class="message" data-from="A" data-to="P" data-label="正常收尾" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="234.66499999999996" y1="534" x2="86.615" y2="534" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="160.64" y="524" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">正常收尾</text>
</g>
<g class="actor" data-id="P" data-label="派单管线" data-type="participant">
  <rect x="40" y="30" width="93.22999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="86.615" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">派单管线</text>
</g>
<g class="actor" data-id="A" data-label="开发结果入口" data-type="participant">
  <rect x="173.22999999999996" y="30" width="122.86999999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="234.66499999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">开发结果入口</text>
</g>
<g class="actor" data-id="D" data-label="工单数据库" data-type="participant">
  <rect x="336.09999999999997" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="390.12499999999994" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">工单数据库</text>
</g>
</svg>

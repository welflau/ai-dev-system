</g>
<g class="edge-label" data-from="R" data-to="E" data-label="找到登记">
  <rect x="372.83599999999996" y="204.8" width="65.17" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="405.42099999999994" y="219.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">找到登记</text>
</g>

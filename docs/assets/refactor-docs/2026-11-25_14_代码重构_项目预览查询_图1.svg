  <text x="405.83599999999996" y="296.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">取可用环境：dev 优先，其次 test、prod</text>
</g>
<g class="node" data-id="B" data-label="返回项目、环境和 index.html 的完整地址" data-shape="rectangle">
  <rect x="129.06800000000004" y="431.30000000000007" width="296.8539999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="277.495" y="449.75000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">返回项目、环境和 index.html 的完整地址</text>
</g>
<g class="node" data-id="P" data-label="返回该端口根地址" data-shape="rectangle">
  <rect x="453.92199999999997" y="431.30000000000007" width="160.51" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="534.1769999999999" y="449.75000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">返回该端口根地址</text>
</g>
</svg>

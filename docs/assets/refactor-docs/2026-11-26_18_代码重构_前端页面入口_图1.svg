  <text x="424.49799999999993" y="185.60699999999997" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">配置目录下的 index.html 是文件吗？</text>
</g>
<g class="node" data-id="C" data-label="发送首页文件：HTML，禁用缓存" data-shape="rectangle">
  <rect x="687.6349999999999" y="118.62133333333333" width="257.5809999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="816.4254999999998" y="137.0713333333333" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">发送首页文件：HTML，禁用缓存</text>
</g>
<g class="node" data-id="D" data-label="404 JSON，说明首页未找到" data-shape="rectangle">
  <rect x="687.6349999999999" y="215.69266666666664" width="220.53099999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="797.9004999999999" y="234.14266666666663" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">404 JSON，说明首页未找到</text>
</g>
<g class="node" data-id="E" data-label="/favicon.ico" data-shape="rectangle">
  <rect x="40.00000000000003" y="359.21399999999994" width="109.381" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="94.69050000000003" y="377.66399999999993" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">/favicon.ico</text>
</g>
<g class="node" data-id="F" data-label="内嵌 SVG，无需读取首页" data-shape="rectangle">
  <rect x="197.38100000000003" y="359.21399999999994" width="204.22899999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="299.4955" y="377.66399999999993" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">内嵌 SVG，无需读取首页</text>
</g>
<g class="node" data-id="G" data-label="/static/styles.css" data-shape="rectangle">
  <rect x="40.00000000000006" y="424.1139999999999" width="141.244" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="110.62200000000006" y="442.5639999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">/static/styles.css</text>
</g>
<g class="node" data-id="H" data-label="仍由原有静态目录挂载处理" data-shape="rectangle">
  <rect x="229.24400000000006" y="424.1139999999999" width="219.78999999999996" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="339.139" y="442.5639999999999" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">仍由原有静态目录挂载处理</text>
</g>
</svg>

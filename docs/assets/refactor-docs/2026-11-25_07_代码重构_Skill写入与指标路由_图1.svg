<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440.90950000000004 360" width="440.90950000000004" height="360" style="--bg:#ffffff;--fg:#1d3839;--accent:#12645e;--border:#608781;background:var(--bg)">
<style>

  text { font-family: 'Microsoft YaHei', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="A" x1="81.061" y1="70" x2="81.061" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="226.14700000000002" y1="70" x2="226.14700000000002" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="B" x1="366.14700000000005" y1="70" x2="366.14700000000005" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="A" data-to="DB" data-label="入口读取，状态和批次 A 匹配" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="81.061" y1="90" x2="226.14700000000002" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="153.604" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">入口读取，状态和批次 A 匹配</text>
</g>
<g class="message" data-from="B" data-to="DB" data-label="同一状态重新派单，当前批次变为 B" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="366.14700000000005" y1="130" x2="226.14700000000002" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="296.14700000000005" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">同一状态重新派单，当前批次变为 B</text>
</g>
<g class="message" data-from="A" data-to="DB" data-label="写结果，要求 ID、来源状态和批次 A 同时匹配" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="81.061" y1="170" x2="226.14700000000002" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="153.604" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">写结果，要求 ID、来源状态和批次 A 同时匹配</text>
</g>
<g class="message" data-from="DB" data-to="A" data-label="更新 0 行，跳过评论、诊断通知及续跑" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="226.14700000000002" y1="210" x2="81.061" y2="210" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="153.604" y="200" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">更新 0 行，跳过评论、诊断通知及续跑</text>
</g>
<g class="message" data-from="B" data-to="DB" data-label="写自己的结果并清除批次 B" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="366.14700000000005" y1="250" x2="226.14700000000002" y2="250" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="296.14700000000005" y="240" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">写自己的结果并清除批次 B</text>
</g>
<g class="message" data-from="DB" data-to="B" data-label="更新 1 行，正常收尾" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="226.14700000000002" y1="290" x2="366.14700000000005" y2="290" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="296.14700000000005" y="280" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">更新 1 行，正常收尾</text>
</g>
<g class="actor" data-id="A" data-label="Skill 执行 A" data-type="participant">
  <rect x="30.000000000000007" y="30" width="102.122" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="81.061" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Skill 执行 A</text>
</g>
<g class="actor" data-id="DB" data-label="工单数据库" data-type="participant">
  <rect x="172.122" y="30" width="108.05" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="226.14700000000002" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">工单数据库</text>
</g>
<g class="actor" data-id="B" data-label="新执行 B" data-type="participant">
  <rect x="321.38450000000006" y="30" width="89.525" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="366.14700000000005" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">新执行 B</text>
</g>
</svg>
